name: MQTV CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Do not interrupt an update while a server is replacing containers.
concurrency:
  group: mqtv-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_IMAGE: ghcr.io/maolikeqvq/mqtv
  DRPY_IMAGE: ghcr.io/maolikeqvq/mqtv-drpy

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reject private release files
        run: node scripts/check-release-files.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check deployment script
        run: |
          bash -n scripts/deploy.sh
          node --test scripts/deploy-check.mjs

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ env.APP_IMAGE }}@${{ steps.app.outputs.digest }}
      drpy_image: ${{ env.DRPY_IMAGE }}@${{ steps.drpy.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          for image in "$APP_IMAGE" "$DRPY_IMAGE"; do
            if [ "$image" = "$APP_IMAGE" ]; then key=app; else key=drpy; fi
            {
              echo "$key<<TAGS"
              echo "$image:sha-$GITHUB_SHA"
              if [ "$REF" = refs/heads/main ]; then echo "$image:latest"; fi
              if [[ "$REF" == refs/tags/v* ]]; then echo "$image:$REF_NAME"; fi
              echo TAGS
            } >> "$GITHUB_OUTPUT"
          done
      - name: Build and publish MQTV
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.app }}
          labels: org.opencontainers.image.source=https://github.com/MaoLikeQvQ/MQTV
          cache-from: type=gha,scope=mqtv
          cache-to: type=gha,mode=max,scope=mqtv
      - name: Build and publish drpy
        id: drpy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.drpy
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.drpy }}
          labels: org.opencontainers.image.source=https://github.com/MaoLikeQvQ/MQTV
          cache-from: type=gha,scope=mqtv-drpy
          cache-to: type=gha,mode=max,scope=mqtv-drpy
      - name: Smoke test published images without private data
        env:
          APP_RELEASE: ${{ env.APP_IMAGE }}@${{ steps.app.outputs.digest }}
          DRPY_RELEASE: ${{ env.DRPY_IMAGE }}@${{ steps.drpy.outputs.digest }}
        run: |
          set -euo pipefail
          app="mqtv-smoke-$GITHUB_RUN_ID"
          drpy="mqtv-drpy-smoke-$GITHUB_RUN_ID"
          trap 'docker rm -fv "$app" "$drpy" >/dev/null 2>&1 || true' EXIT
          docker pull "$APP_RELEASE"
          docker pull "$DRPY_RELEASE"
          docker run -d --name "$app" --network none \
            -e CATALOG_AUTO_SYNC=0 -e DRPY_ENABLED=0 "$APP_RELEASE"
          docker run -d --name "$drpy" --network none \
            -e DRPY_API_KEY=ci-smoke-test-key "$DRPY_RELEASE"
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$app" node -e "fetch('http://127.0.0.1:8080/api/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
              && docker exec "$drpy" node -e "fetch('http://127.0.0.1:5757/health',{headers:{'x-api-key':'ci-smoke-test-key'},signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            sleep 2
          done
          [ "$ready" = 1 ] || { echo 'Published image health checks failed'; exit 1; }
          docker exec "$app" node -e "(async()=>{const r=await fetch('http://127.0.0.1:8080/api/status',{signal:AbortSignal.timeout(5000)});if(!r.ok)throw Error('status request failed');const data=await r.json();for(const key of ['defaultSources','defaultLiveSources','defaultSubscriptions'])if(!Array.isArray(data[key])||data[key].length)throw Error('Image must start with empty private source lists');})().catch(e=>{console.error(e.message);process.exit(1)})"

  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: mqtv-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/mqtv' }}
      APP_RELEASE: ${{ needs.publish.outputs.app_image }}
      DRPY_RELEASE: ${{ needs.publish.outputs.drpy_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy exact published images
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Configure DEPLOY_HOST}"
          : "${DEPLOY_USER:?Configure DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Configure DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Configure verified DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9._-]+$ ]] && [[ "$DEPLOY_HOST" != -* ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]] && [[ "$DEPLOY_USER" != -* ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          [[ "$APP_RELEASE" =~ ^ghcr.io/maolikeqvq/mqtv@sha256:[a-f0-9]{64}$ ]]
          [[ "$DRPY_RELEASE" =~ ^ghcr.io/maolikeqvq/mqtv-drpy@sha256:[a-f0-9]{64}$ ]]
          install -d -m 700 "$HOME/.ssh"
          key="$RUNNER_TEMP/mqtv-deploy-key"
          hosts="$RUNNER_TEMP/mqtv-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          ssh -i "$key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$APP_RELEASE' '$DRPY_RELEASE'" < scripts/deploy.sh
